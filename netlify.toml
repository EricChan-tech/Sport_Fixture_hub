[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  # esbuild bundles the functions. The pipeline modules they import stay valid
  # if that output is CommonJS. Blobs stays external so it can read the
  # function runtime's NETLIFY_BLOBS_CONTEXT instead of a bundled empty env.
  node_bundler = "esbuild"
  external_node_modules = ["@netlify/blobs"]
  included_files = [
    "public/fixtures/**",
    "pipeline/**",
    "pipeline/sources.config.json",
    "src/config/mapping.seed.json",
    "src/lib/productRules.mjs",
    "src/lib/sources.mjs",
    "data/mapping/seeds/macau_lottery/*.json",
  ]

[[redirects]]
  from = "/api/mapping/*"
  to = "/.netlify/functions/mapping"
  status = 200
  force = true

[[redirects]]
  from = "/api/schedule-jobs"
  to = "/.netlify/functions/schedule-job"
  status = 200
  force = true

[[redirects]]
  from = "/api/schedule-jobs/:id"
  to = "/.netlify/functions/schedule-job?job_id=:id"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fixtures/*"
  [headers.values]
    Cache-Control = "public, max-age=60"
